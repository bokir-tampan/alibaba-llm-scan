name: wave11-probe

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wave11

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -q aiohttp

      - name: Unpack chunk
        run: tar xzf w11/w11_0${{ matrix.shard }}.tgz

      - name: Probe /v1/models
        env:
          CONC: "250"
          TO: "2.5"
        run: python3 probe_fast.py w11_0${{ matrix.shard }} wave11_hits_${{ matrix.shard }}.jsonl

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w11-hits-${{ matrix.shard }}
          path: wave11_hits_${{ matrix.shard }}.jsonl
          if-no-files-found: ignore

      - name: Commit results to wave11 branch
        run: |
          git config user.name "scan-bot"
          git config user.email "scan-bot@users.noreply.github.com"
          BR="wave11"
          mkdir -p w11_art/w11-${{ matrix.shard }}
          cp wave11_hits_${{ matrix.shard }}.jsonl w11_art/w11-${{ matrix.shard }}/ || true
          for i in 1 2 3 4 5 6 7 8; do
            git pull --rebase origin "$BR" && \
            git add w11_art/w11-${{ matrix.shard }} && \
            (git diff --cached --quiet || git commit -m "wave11 shard ${{ matrix.shard }} hits") && \
            git push origin "HEAD:$BR" && break || sleep $((RANDOM % 25 + 5))
          done
