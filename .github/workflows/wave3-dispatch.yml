name: wave3-dispatch

on:
  repository_dispatch:
    types: [wave3-go]

permissions:
  actions: write
  contents: read

jobs:
  kick:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger probe
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          for i in $(seq 1 20); do
            code=$(curl -sS -o /dev/null -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              https://api.github.com/repos/$REPO/actions/workflows/428675997/dispatches)
            echo "try$i=$code"
            [ "$code" = "204" ] && break
            sleep 15
          done
